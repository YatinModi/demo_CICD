name: iOS CI/CD

on:
  push:
    branches:
      - yatin_cicd

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Set System-wide Environment Variable
        run: |
          echo "export IDEFileSystemSynchronizedGroupsAreEnabled=YES" >> ~/.bash_profile
          echo "export IDEFileSystemSynchronizedGroupsAreEnabled=YES" >> ~/.zshrc
          echo "IDEFileSystemSynchronizedGroupsAreEnabled=YES" >> $GITHUB_ENV
          sudo launchctl setenv IDEFileSystemSynchronizedGroupsAreEnabled YES

      - name: Verify Environment Variable
        run: echo "IDEFileSystemSynchronizedGroupsAreEnabled=$IDEFileSystemSynchronizedGroupsAreEnabled"

      - name: Install dependencies
        run: pod install

      - name: Clean Derived Data
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Run UI Tests
        run: |
           export IDEFileSystemSynchronizedGroupsAreEnabled=NO
           xcodebuild test \
            -workspace MommyMap.xcworkspace \
           -scheme MommyMapUITests \
            -sdk iphonesimulator \
            -destination ‘platform=iOS Simulator,name=iPhone 11,OS=17.4’ \
            CODE_SIGNING_ALLOWED=NO | xcpretty

      - name: Build and Archive
        run: |
          env IDEFileSystemSynchronizedGroupsAreEnabled=YES xcodebuild clean build \
            -workspace MommyMap.xcworkspace \
            -scheme MommyMap \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          env IDEFileSystemSynchronizedGroupsAreEnabled=YES xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/MommyMap.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist ExportOptions.plist \
            CODE_SIGNING_ALLOWED=NO
