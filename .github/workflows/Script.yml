
name: iOS CI/CD

on:
  push:
    branches:
      - yatin_cicd

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install dependencies
        run: pod install

      - name: Run UI Tests
        run: |
            export IDEFileSystemSynchronizedGroupsAreEnabled=NO
            xcodebuild test -workspace MommyMap.xcworkspace \
            -scheme MommyMapUITests \
            -destination “platform=iOS Simulator,name=iPhone 15” \
            -only-testing:MommyMapUITests

