name: iOS CI/CD

on:
  push:
    branches:
      - yatin_cicd

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install dependencies
        run: pod install

      - name: Clean Derived Data
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: IDEFileSystemSynchronizedGroupsAreEnabled=YES Run UI Tests
        run: |
           xcodebuild test \
            -workspace MommyMap.xcworkspace \
           -scheme MommyMapUITests \
            -sdk iphonesimulator \
            -destination ‘platform=iOS Simulator,name=iPhone 11,OS=17.4’ \
            CODE_SIGNING_ALLOWED=NO | xcpretty

      - name: Build
        run: |
            IDEFileSystemSynchronizedGroupsAreEnabled=YES xcodebuild clean build
            -workspace MommyMap.xcworkspace \
            -scheme MommyMap \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: IDEFileSystemSynchronizedGroupsAreEnabled=YES Export IPA
        run: |
          env IDEFileSystemSynchronizedGroupsAreEnabled=NO xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/MommyMap.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist ExportOptions.plist \
            CODE_SIGNING_ALLOWED=NO
