
name: iOS CI/CD

on:
  push:
    branches:
      - yatin_cicd

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Set Environment Variable
        run: |
            echo "IDEFileSystemSynchronizedGroupsAreEnabled=NO" >> $GITHUB_ENV
            export IDEFileSystemSynchronizedGroupsAreEnabled=NO
            echo "IDEFileSystemSynchronizedGroupsAreEnabled=$IDEFileSystemSynchronizedGroupsAreEnabled"

      - name: Check Environment Variable
        run: echo "IDEFileSystemSynchronizedGroupsAreEnabled=$IDEFileSystemSynchronizedGroupsAreEnabled"

      - name: Install dependencies
        run: pod install

      - name: Debug Environment Before Running UI Tests
        run: env | sort

      - name: Run UI Tests
        run: |
          export IDEFileSystemSynchronizedGroupsAreEnabled=NO
          xcodebuild test \
          -workspace MommyMap.xcworkspace \
          -scheme MommyMapUITests \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 11,OS=17.4' \
          CODE_SIGNING_ALLOWED=NO | xcpretty

      - name: Build
        run: |
          env IDEFileSystemSynchronizedGroupsAreEnabled=NO xcodebuild clean build \
          -workspace MommyMap.xcworkspace \
          -scheme MommyMap \
          -configuration Release \
          -destination "generic/platform=iOS" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

      - name: Set Environment in Shell
        run: |
          echo "export IDEFileSystemSynchronizedGroupsAreEnabled=NO" >> ~/.zshrc
          source ~/.zshrc

      - name: Archive
        run: |
          export IDEFileSystemSynchronizedGroupsAreEnabled=NO
          xcodebuild archive \
          -workspace MommyMap.xcworkspace \
          -scheme MommyMap \
          -configuration Release \
          -archivePath $RUNNER_TEMP/MommyMap.xcarchive \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          export IDEFileSystemSynchronizedGroupsAreEnabled=NO
          xcodebuild -exportArchive \
          -archivePath $RUNNER_TEMP/MommyMap.xcarchive \
          -exportPath $RUNNER_TEMP/export \
          -exportOptionsPlist ExportOptions.plist \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO


